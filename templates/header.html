    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #14123a;
            --paper: #f3ecd9;
            --gold: #e8b84a;
            --teal: #3cc6b5;
            --rose: #ef6a6a;
            --muted: #5b5877;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --ink: #14123a;
                --paper: #f3ecd9;
                --gold: #e8b84a;
                --teal: #3cc6b5;
                --rose: #ef6a6a;
                --muted: #5b5877
            }
        }

        :root[data-theme="dark"] {
            --ink: #14123a;
            --paper: #f3ecd9;
            --gold: #e8b84a;
            --teal: #3cc6b5;
            --rose: #ef6a6a;
            --muted: #5b5877
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--ink);
            overflow: hidden;
            font-family: Lato, system-ui, sans-serif;
            color: var(--ink);
            overscroll-behavior: none
        }

        canvas {
            display: block;
            position: fixed;
            inset: 0;
            touch-action: none
        }

        #hud {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: 0;
            right: 0;
            display: none;
            flex-direction: column;
            gap: 4px;
            padding: 8px 16px 4px;
            color: var(--paper);
            font-weight: 700;
            pointer-events: none
        }

        #stats {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: clamp(.8rem, 2.6vw, 1rem)
        }

        #status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 28px
        }

        #quit {
            pointer-events: auto;
            min-height: 0;
            padding: 2px 14px;
            font-size: .85rem;
            border-radius: 99px;
            background: rgba(243, 236, 217, .15);
            border: 1px solid var(--paper)
        }

        #hud b {
            font-size: clamp(1rem, 3.6vw, 1.4rem);
            color: var(--gold);
            margin-left: 4px
        }

        #fx {
            display: flex;
            gap: 6px
        }

        #fx span {
            padding: 2px 10px;
            border-radius: 99px;
            background: var(--teal);
            color: var(--ink);
            font-size: .8rem
        }

        #toast {
            color: var(--paper);
            background: rgba(20, 18, 58, .85);
            padding: 3px 14px;
            border-radius: 99px;
            font-weight: 700;
            font-size: clamp(.75rem, 2.4vw, .95rem);
            display: none;
            text-align: center
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            padding: 16px;
            overflow: auto
        }

        .overlay.hidden {
            display: none
        }

        .win {
            margin: auto;
            width: min(560px, 100%);
            background: var(--paper);
            border: 3px solid var(--ink);
            box-shadow: 8px 8px 0 var(--ink);
            border-radius: 6px;
            overflow: hidden
        }

        .bar {
            background: var(--gold);
            border-bottom: 3px solid var(--ink);
            padding: 8px 14px;
            font-weight: 600;
            font-size: .9rem
        }

        .body {
            padding: clamp(14px, 4vw, 20px) clamp(16px, 5vw, 24px) clamp(16px, 5vw, 24px)
        }

        h1,
        h2 {
            font-weight: 900;
            margin: 0 0 4px;
            line-height: 1.05
        }

        h1 {
            font-size: clamp(1.8rem, 7vw, 2.5rem)
        }

        h2 {
            font-size: clamp(1.6rem, 6vw, 2rem)
        }

        p {
            margin: 8px 0;
            line-height: 1.45
        }

        label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0;
            font-weight: 600
        }

        input {
            flex: 1;
            font: inherit;
            padding: 8px 10px;
            border: 2px solid var(--ink);
            border-radius: 4px;
            background: #fff;
            min-width: 0
        }

        ul {
            padding-left: 20px;
            margin: 8px 0 16px;
            line-height: 1.5
        }

        li b {
            font-weight: 700
        }

        button {
            min-height: 44px;
            font: 700 1.1rem Lato, sans-serif;
            background: var(--ink);
            color: var(--paper);
            border: none;
            border-radius: 4px;
            padding: 12px 32px;
            cursor: pointer
        }

        button:hover {
            background: #2a2766
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid var(--teal);
            outline-offset: 2px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: .95rem
        }

        th,
        td {
            text-align: left;
            padding: 5px 8px;
            border-bottom: 1px solid #cfc7ae
        }

        tr.me td {
            background: var(--gold);
            font-weight: 600
        }

        pre {
            margin: 8px 0 16px;
            max-height: 130px;
            overflow: auto;
            background: var(--ink);
            color: var(--teal);
            padding: 10px;
            border-radius: 4px;
            font-size: .75rem
        }

        .small {
            font-size: .8rem;
            color: var(--muted)
        }
    </style>
